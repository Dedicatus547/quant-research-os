schema_version: validation-policy/v1
policy_id: synthetic_validation_engineering_v1
hard_gates:
  - schema
  - snapshot_integrity
  - data_quality
  - pit
  - reproducibility
  - artifact_integrity
soft_gates: []
annualization_factor: 250
minimum_oos_observations: 1
cost_stress_multipliers: [1.0, 1.5, 2.0]
# The fixture marks 2024-01-03 suspended, so a two-session reference is
# intentionally non-finite. Windows 1 and 3 both exercise real perturbations
# while retaining Qlib's strict finite-score gate.
parameter_windows: [1, 3]
parameter_top_k: [1, 2]
subperiods:
  - schema_version: validation-subperiod/v1
    period_id: 2024-01
    start: 2024-01-01
    end: 2024-01-09
minimum_subperiod_observations: 1
reproducibility_absolute_tolerance: 1.0e-12
reproducibility_relative_tolerance: 1.0e-9
