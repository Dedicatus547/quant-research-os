schema_version: research-ledger-search-policy/v1
policy_id: p14-deterministic-lexical-v1
tokenizer_id: unicode-word-v1
ranking_id: term-frequency-object-hash-v1
allowed_node_kinds:
  - CAMPAIGN_SELECTION_REPORT
  - CAMPAIGN_TRIAL
  - EVIDENCE
  - EXPERIMENT
  - EXTRACTED_TEXT
  - FACTOR_PROPOSAL
  - HUMAN_REVIEW_STATEMENT
  - HYPOTHESIS_PROPOSAL
  - INTERPRETATION_PROPOSAL
  - OBSERVATION_PROPOSAL
  - RESEARCH_RESULT
  - VALIDATION_REPORT
allowed_authorities:
  - AGENT_PROPOSAL
  - DETERMINISTIC_EVIDENCE
  - DETERMINISTIC_VERDICT
  - HUMAN_REVIEWED
  - SOURCE_ASSERTION
allow_cross_campaign_history: true
max_query_terms: 32
max_results: 50
max_serialized_bytes: 262144
