name: offline-ci

on:
  push:
  pull_request:

concurrency:
  group: offline-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install offline test OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap zsh libseccomp2
      - name: Verify actual bwrap context and enable the reviewed CI profile
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
          test "${ImageVersion:-}" = 20261012.334.1
          test "$(uname -r)" = 6.17.0-1022-azure
          test "$(id -u)" != 0
          test "$(dpkg-query -W -f='${Version}' apparmor)" = 4.0.1really4.0.1-0ubuntu0.24.04.8
          test "$(stat -c '%a %u:%g' /usr/bin/bwrap)" = '755 0:0'
          printf '%s  %s\n' ad542ad50c2ccd43cf1b1e8d242bc0329b6375cd49ff3bec1233b6ededfed94e /sbin/apparmor_parser | sha256sum --check --strict
          printf '%s  %s\n' e318903862396f96de3df57264e0158682b952fd3fb53ac23d876413e7b30f71 /usr/bin/bwrap | sha256sum --check --strict
          printf '%s  %s\n' 45aab8ec644fc7a5a4356eb1c5a633770f51276633d0065df7ad18f929201b8f ci/apparmor/quantos-ci-bwrap.profile | sha256sum --check --strict
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          test "$(cat /proc/sys/kernel/unprivileged_userns_clone)" = 1
          /usr/bin/python3 -I -B ci/apparmor/runtime_guard.py label --expected unconfined
          sudo /usr/bin/python3 -I -B ci/apparmor/identity_v2/collect.py > "$RUNNER_TEMP/quantos-apparmor-grouped.json"
          sha256sum "$RUNNER_TEMP/quantos-apparmor-grouped.json"
          /usr/bin/python3 -I -B - "$RUNNER_TEMP/quantos-apparmor-grouped.json" <<'PY_INVENTORY'
          import base64, json, sys, zlib
          raw = open(sys.argv[1], 'rb').read()
          inventory = json.loads(raw)
          print('APPARMOR_INVENTORY_ZLIB_BASE64=' + base64.b64encode(zlib.compress(raw)).decode())
          assert inventory['collection_complete'] and inventory['other_namespaces'] == []
          assert not any(p['fields']['name']['value'].strip().startswith('quantos_ci_bwrap')
                         for p in inventory['profiles'])
          print({'profile_count': inventory['profile_count'],
                 'unknown_attachments_unresolved': inventory['unknown_attachment_count']})
          PY_INVENTORY
          for node in .ns_level .ns_stacked .stacked; do
            printf '%s=' "$node"
            cat "/sys/kernel/security/apparmor/$node"
          done
          test "$(cat /sys/kernel/security/apparmor/.ns_level)" = 0
          test "$(cat /sys/kernel/security/apparmor/.ns_stacked)" = no
          test "$(cat /sys/kernel/security/apparmor/.stacked)" = no
          sudo test ! -e /etc/apparmor.d/quantos-ci-bwrap
          sudo test ! -L /etc/apparmor.d/quantos-ci-bwrap
          loaded_profiles=$(sudo cat /sys/kernel/security/apparmor/profiles)
          if grep -q '^quantos_ci_bwrap ' <<< "$loaded_profiles"; then
            echo 'Reserved profile already loaded; refusing replacement.' >&2
            exit 1
          fi
          # Syntax only, before the first host-policy write; no cache or kernel load.
          sudo /sbin/apparmor_parser --config-file /dev/null --skip-cache --skip-kernel-load ci/apparmor/quantos-ci-bwrap.profile
          stage=$(sudo mktemp /etc/apparmor.d/.quantos-ci-bwrap.XXXXXXXX)
          trap 'sudo rm -f -- "$stage"' EXIT
          sudo install -o root -g root -m 0644 ci/apparmor/quantos-ci-bwrap.profile "$stage"
          sudo ln -- "$stage" /etc/apparmor.d/quantos-ci-bwrap
          printf '%s\n' created > "$RUNNER_TEMP/quantos-apparmor-created"
          printf '%s  %s\n' 45aab8ec644fc7a5a4356eb1c5a633770f51276633d0065df7ad18f929201b8f /etc/apparmor.d/quantos-ci-bwrap | sudo sha256sum --check --strict
          sudo /sbin/apparmor_parser --config-file /dev/null --skip-cache --add /etc/apparmor.d/quantos-ci-bwrap
          sudo cat /sys/kernel/security/apparmor/profiles | grep '^quantos_ci_bwrap '
          /usr/bin/python3 -I -B ci/apparmor/runtime_guard.py label --expected quantos_ci_bwrap
      - name: Check offline test namespace prerequisites
        run: |
          /usr/bin/bwrap --version
          /usr/bin/zsh --version
          if /usr/bin/bwrap --unshare-user --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev --size 1048576 --tmpfs /run \
            /usr/bin/true; then
            exit 0
          else
            namespace_exit=$?
            # Read-only diagnostics; retain the real probe failure even if a read is denied.
            set +e
            uname -sr
            /usr/bin/id
            sha256sum /usr/bin/bwrap
            stat -c '%a %u:%g %n' /usr/bin/bwrap
            for status_file in /proc/$$/attr/current /proc/$$/uid_map /proc/$$/gid_map \
              /sys/kernel/security/lsm \
              /sys/module/apparmor/parameters/enabled \
              /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
              /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
              echo "$status_file"
              if [[ -r "$status_file" ]]; then
                head -c 4096 "$status_file"
                echo
              else
                echo "UNAVAILABLE"
              fi
            done
            sed -n '/^Cap/p; /^NoNewPrivs:/p; /^Seccomp/p' /proc/$$/status
            journalctl --quiet --no-pager --dmesg --since '-2 min' --lines=40 \
              --grep='bwrap|userns_create|RTM_NEWADDR'
            exit "$namespace_exit"
          fi
      - name: Verify nested namespaces, capabilities and unrelated denial
        run: /usr/bin/python3 -I -B ci/apparmor/runtime_guard.py boundaries
      - run: uv sync --frozen --extra agent-openai
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest --cov=quantos --cov-report=term-missing --cov-report=xml
      - name: Retain candidate AppArmor audit and remove only this job's policy
        if: always()
        run: |
          set +e
          journalctl --quiet --no-pager --dmesg --since '-10 min' --lines=60 \
            --grep='bwrap|userns_create|RTM_NEWADDR|quantos_ci_bwrap'
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/quantos-apparmor-created" ]]; then
            exit 0
          fi
          printf '%s  %s\n' 45aab8ec644fc7a5a4356eb1c5a633770f51276633d0065df7ad18f929201b8f /etc/apparmor.d/quantos-ci-bwrap | sudo sha256sum --check --strict
          sudo /usr/bin/python3 -I -B - <<'PY_LABELS'
          import errno
          import pathlib
          import sys
          live = []
          for entry in pathlib.Path('/proc').iterdir():
              if not entry.name.isdecimal():
                  continue
              try:
                  label = (entry / 'attr/current').read_text()
              except OSError as error:
                  if error.errno in (errno.ENOENT, errno.ESRCH):
                      continue
                  raise
              if 'quantos_ci_bwrap' in label:
                  live.append((entry.name, label.strip()))
          print('remaining candidate labels:', live)
          sys.exit(bool(live))
          PY_LABELS
          # A failed add may have left only the file. Never remove another name.
          loaded_profiles=$(sudo cat /sys/kernel/security/apparmor/profiles)
          if grep -q '^quantos_ci_bwrap ' <<< "$loaded_profiles"; then
            sudo /sbin/apparmor_parser --config-file /dev/null --skip-cache --remove /etc/apparmor.d/quantos-ci-bwrap
          fi
          sudo rm -- /etc/apparmor.d/quantos-ci-bwrap
          rm -- "$RUNNER_TEMP/quantos-apparmor-created"
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          test "$(cat /proc/sys/kernel/unprivileged_userns_clone)" = 1
          /usr/bin/python3 -I -B ci/apparmor/runtime_guard.py label --expected unconfined
