name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install offline test OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap zsh libseccomp2
      - name: Inspect grouped AppArmor identity (no policy writes)
        run: |
          set -euo pipefail
          . /etc/os-release
          printf 'os=%s version=%s image=%s kernel=%s\n' "$ID" "$VERSION_ID" "${ImageVersion:-UNAVAILABLE}" "$(uname -r)"
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' apparmor
          /sbin/apparmor_parser --version
          readlink -f /sbin/apparmor_parser
          sha256sum /sbin/apparmor_parser /usr/bin/bwrap ci/apparmor/identity_v2/collect.py
          # -I ignores Python environment/site settings; the script only reads policy metadata.
          collection_exit=0
          sudo /usr/bin/python3 -I -B ci/apparmor/identity_v2/collect.py \
            > "$RUNNER_TEMP/quantos-apparmor-grouped.json" || collection_exit=$?
          cat "$RUNNER_TEMP/quantos-apparmor-grouped.json"
          sha256sum "$RUNNER_TEMP/quantos-apparmor-grouped.json"
          if [[ "$collection_exit" != 0 ]]; then
            exit "$collection_exit"
          fi
          sha256sum ci/apparmor/provenance_v3/capture.py ci/apparmor/provenance_v3/binding.py \
            ci/apparmor/provenance_v3/source-plan.json
          inventory_sha=$(sha256sum "$RUNNER_TEMP/quantos-apparmor-grouped.json")
          inventory_sha=${inventory_sha%% *}
          provenance_exit=0
          sudo /usr/bin/python3 -I -B ci/apparmor/provenance_v3/capture.py \
            --inventory "$RUNNER_TEMP/quantos-apparmor-grouped.json" \
            --inventory-sha256 "$inventory_sha" --image-version "${ImageVersion:?}" \
            > "$RUNNER_TEMP/quantos-apparmor-provenance.json" || provenance_exit=$?
          cat "$RUNNER_TEMP/quantos-apparmor-provenance.json"
          sha256sum "$RUNNER_TEMP/quantos-apparmor-provenance.json"
          exit "$provenance_exit"
      - name: Check offline test namespace prerequisites
        run: |
          /usr/bin/bwrap --version
          /usr/bin/zsh --version
          if /usr/bin/bwrap --unshare-user --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev --size 1048576 --tmpfs /run \
            /usr/bin/true; then
            exit 0
          else
            namespace_exit=$?
            # Read-only diagnostics; retain the real probe failure even if a read is denied.
            set +e
            uname -sr
            /usr/bin/id
            sha256sum /usr/bin/bwrap
            stat -c '%a %u:%g %n' /usr/bin/bwrap
            for status_file in /proc/$$/attr/current /proc/$$/uid_map /proc/$$/gid_map \
              /sys/kernel/security/lsm \
              /sys/module/apparmor/parameters/enabled \
              /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
              /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
              echo "$status_file"
              if [[ -r "$status_file" ]]; then
                head -c 4096 "$status_file"
                echo
              else
                echo "UNAVAILABLE"
              fi
            done
            sed -n '/^Cap/p; /^NoNewPrivs:/p; /^Seccomp/p' /proc/$$/status
            journalctl --quiet --no-pager --dmesg --since '-2 min' --lines=40 \
              --grep='bwrap|userns_create|RTM_NEWADDR'
            exit "$namespace_exit"
          fi
      - run: uv sync --frozen --extra agent-openai
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest --cov=quantos --cov-report=term-missing --cov-report=xml
