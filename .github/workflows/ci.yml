name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.25"
          enable-cache: true
      - name: Install offline test OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap zsh libseccomp2
      - name: Check offline test namespace prerequisites
        run: |
          /usr/bin/bwrap --version
          /usr/bin/zsh --version
          /usr/bin/bwrap --unshare-user --unshare-net --unshare-pid --die-with-parent \
            --ro-bind / / --proc /proc --dev /dev --size 1048576 --tmpfs /run \
            /usr/bin/true
      - run: uv sync --frozen --extra agent-openai
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest --cov=quantos --cov-report=term-missing --cov-report=xml
