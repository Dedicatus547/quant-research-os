[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quant-research-os"
version = "0.1.0.dev0"
description = "Deterministic, auditable A-share quantitative research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "quant-research-os contributors" }]
dependencies = [
  "lightgbm>=4.6,<5",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pydantic>=2.10,<3",
  "pyqlib>=0.9.7,<0.10",
  "pyrate-limiter>=3.7,<4",
  "ruamel-yaml>=0.18,<0.19",
  "tenacity>=9,<10",
  "tushare>=1.4,<2",
  "typer>=0.16,<1",
]

[project.scripts]
quantos = "quantos.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "pandas-stubs>=2.3,<3",
  "pyarrow-stubs>=20.0.0.20260819",
  "pyright>=1.1.400,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-socket>=0.7,<1",
  "ruff>=0.11,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantos"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --disable-socket"
testpaths = ["tests"]
markers = [
  "live: requires an explicit Tushare token and network access",
]

[tool.coverage.run]
branch = true
source = ["quantos"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
